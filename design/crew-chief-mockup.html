<title>Crew Chief F1 25</title>
<style>
  :root {
    --bg: oklch(0.16 0.02 260);
    --bg-elev: oklch(0.205 0.02 260);
    --bg-elev-2: oklch(0.26 0.02 260);
    --border: oklch(0.32 0.02 260);
    --text: oklch(0.95 0.01 260);
    --text-dim: oklch(0.68 0.02 260);
    --text-dimmer: oklch(0.50 0.02 260);
    --accent: oklch(0.75 0.15 235);
    --accent-ink: oklch(0.18 0.03 235);
    --purple: oklch(0.72 0.19 300);
    --green: oklch(0.78 0.18 150);
    --red: oklch(0.68 0.20 25);
    --red-soft: oklch(0.68 0.20 25 / 0.14);
    --green-soft: oklch(0.78 0.18 150 / 0.14);
    --red-row: oklch(0.68 0.20 25 / 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; color: var(--text); }
  ::selection { background: var(--accent); color: var(--bg); }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { color: oklch(0.85 0.13 235); }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
  .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dimmer); font-weight: 600; }
  .nav-btn { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; border: 1px solid transparent; color: var(--text-dim); }
  .nav-btn:hover { background: var(--bg-elev-2); }
  .nav-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .nav-btn.active { background: var(--bg-elev-2); color: var(--text); border-color: var(--border); }
  .pill { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--bg-elev); color: var(--text-dim); border: 1px solid var(--border); }
  .pill.active { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  input[type="number"] {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px;
    padding: 7px 10px; width: 90px;
  }
  input[type="number"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  table { border-collapse: collapse; width: 100%; }
  th { text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dimmer); font-weight: 600; padding: 0 10px 8px; }
  td { padding: 9px 10px; font-size: 13px; border-top: 1px solid var(--border); }
  .tablewrap { overflow-x: auto; }
  .stat-box { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; }
  .badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 5px; }
</style>

<div style="display:flex; min-height:100vh; width:100%;">

  <!-- Sidebar -->
  <div style="width:216px; flex-shrink:0; background:var(--bg-elev); border-right:1px solid var(--border); display:flex; flex-direction:column; padding:22px 14px;">
    <div style="display:flex; align-items:center; gap:8px; padding:4px 8px 4px;">
      <div style="width:8px; height:22px; background:var(--accent); border-radius:2px;"></div>
      <div>
        <div style="font-weight:700; font-size:16px; letter-spacing:0.01em;">CREW CHIEF</div>
        <div style="font-size:11px; color:var(--text-dim);">F1 25 · Telemetría</div>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:3px; margin-top:26px;">
      <div class="label" style="padding:0 8px 6px;">Navegación</div>

      <div class="nav-btn" id="nav-circuito" onclick="setView('circuito')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18c0-6 4-9 8-9s8 3 8 9"/><path d="M4 18h16"/><circle cx="12" cy="6" r="2.5"/></svg>
        Circuito
      </div>
      <div class="nav-btn" id="nav-sesion" onclick="setView('sesion')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
        Sesión
      </div>
      <div class="nav-btn" id="nav-config" onclick="setView('config')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.96 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.96a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg>
        Configuración
      </div>
    </div>

    <div style="margin-top:auto; padding:8px; font-size:11px; color:var(--text-dimmer); line-height:1.5;">
      Prototipo de diseño<br>datos de ejemplo
    </div>
  </div>

  <!-- Main content -->
  <div id="main" style="flex-grow:1; padding:34px 42px; min-width:0;"></div>
</div>

<script>
const FLAGS = {
  italia: '<svg width="36" height="24" viewBox="0 0 36 24"><rect width="12" height="24" fill="#0a7a3c"/><rect x="12" width="12" height="24" fill="#f4f5f0"/><rect x="24" width="12" height="24" fill="#c8283c"/></svg>',
  belgica: '<svg width="36" height="24" viewBox="0 0 36 24"><rect width="12" height="24" fill="#1a1a1a"/><rect x="12" width="12" height="24" fill="#f4c62e"/><rect x="24" width="12" height="24" fill="#c8283c"/></svg>',
  monaco: '<svg width="36" height="24" viewBox="0 0 36 24"><rect width="36" height="12" fill="#c8283c"/><rect y="12" width="36" height="12" fill="#f4f5f0"/></svg>'
};

const TRACKS = {
  monza: '<svg width="170" height="100" viewBox="0 0 200 120" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24,70 C24,40 55,24 100,24 C145,24 176,36 176,58 L176,64 C176,78 158,78 154,68 C150,58 138,62 140,74 C142,86 162,90 176,84 L176,90 C176,102 140,106 100,104 C58,102 24,92 24,78 Z"/></svg>',
  spa: '<svg width="170" height="100" viewBox="0 0 200 120" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M30,30 C50,26 70,30 78,42 C86,54 78,64 64,64 C50,64 46,74 56,82 C68,92 100,96 130,90 C160,84 178,68 172,52 C168,40 152,38 146,48 C140,58 150,66 162,60 C176,53 178,36 166,26 C152,15 120,14 90,18 C64,21 40,24 30,30 Z"/></svg>',
  monaco: '<svg width="170" height="100" viewBox="0 0 200 120" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M40,50 C36,36 50,28 66,30 C82,32 84,44 74,48 C64,52 62,60 72,64 L140,64 C154,64 156,50 144,46 C132,42 132,30 146,26 C162,22 178,32 176,48 C174,62 158,66 158,78 C158,90 176,92 178,80 M178,80 C178,96 150,100 116,96 C90,93 60,88 46,74 C36,64 38,58 40,50 Z"/></svg>'
};

function fmtSector(sec) { return sec.toFixed(3); }
function fmtLap(totalSec) {
  const m = Math.floor(totalSec / 60);
  const s = totalSec - m * 60;
  return m + ':' + s.toFixed(3).padStart(6, '0');
}
function fmtDelta(sec) {
  return (sec >= 0 ? '-' : '+') + Math.abs(sec).toFixed(3) + 's';
}
function esc(s) {
  return String(s).replace(/'/g, "\\'");
}

const CIRCUITOS = {
  monza: {
    nombre: 'Monza', pais: 'Italia', flag: 'italia', track: 'monza',
    mejorVuelta: { total: 79.847, s1: 24.112, s2: 30.481, s3: 25.254, fecha: '10 sep 2026', sesion: 'Clasificación · 10 sep 2026' },
    teorica: {
      s1: { sec: 24.058, vuelta: 12, sesion: 'Clasificación · 10 sep 2026' },
      s2: { sec: 30.481, vuelta: 18, sesion: 'Clasificación · 10 sep 2026' },
      s3: { sec: 25.112, vuelta: 8, sesion: 'Práctica 2 · 9 sep 2026' }
    },
    setup: { aleronD: 2, aleronT: 1, difOn: 55, difOff: 60, repartoFreno: 54, presionFreno: 100 }
  },
  spa: {
    nombre: 'Spa-Francorchamps', pais: 'Bélgica', flag: 'belgica', track: 'spa',
    mejorVuelta: { total: 102.339, s1: 26.884, s2: 42.771, s3: 32.684, fecha: '13 sep 2026', sesion: 'Clasificación · 13 sep 2026' },
    teorica: {
      s1: { sec: 26.741, vuelta: 5, sesion: 'Práctica 2 · 12 sep 2026' },
      s2: { sec: 42.771, vuelta: 14, sesion: 'Clasificación · 13 sep 2026' },
      s3: { sec: 32.512, vuelta: 19, sesion: 'Carrera · 14 sep 2026' }
    },
    setup: { aleronD: 4, aleronT: 5, difOn: 60, difOff: 65, repartoFreno: 56, presionFreno: 98 }
  },
  monaco: {
    nombre: 'Mónaco', pais: 'Mónaco', flag: 'monaco', track: 'monaco',
    mejorVuelta: { total: 70.923, s1: 21.847, s2: 26.501, s3: 22.575, fecha: '21 ago 2026', sesion: 'Clasificación · 21 ago 2026' },
    teorica: {
      s1: { sec: 21.762, vuelta: 3, sesion: 'Clasificación · 21 ago 2026' },
      s2: { sec: 26.501, vuelta: 11, sesion: 'Clasificación · 21 ago 2026' },
      s3: { sec: 22.398, vuelta: 30, sesion: 'Carrera · 22 ago 2026' }
    },
    setup: { aleronD: 9, aleronT: 10, difOn: 45, difOff: 70, repartoFreno: 60, presionFreno: 105 }
  }
};

const SESION_LAPS_RAW = [
  { numero: 1,  s1: 28.104, s2: 44.897, s3: 36.203, neumatico: 'Medio', valida: true },
  { numero: 2,  s1: 27.801, s2: 44.203, s3: 35.846, neumatico: 'Medio', valida: true },
  { numero: 3,  s1: 27.552, s2: 44.001, s3: 35.549, neumatico: 'Medio', valida: true },
  { numero: 4,  s1: 27.903, s2: 44.298, s3: 35.759, neumatico: 'Medio', valida: true },
  { numero: 5,  s1: 27.301, s2: 43.799, s3: 35.784, neumatico: 'Medio', valida: true },
  { numero: 6,  s1: 29.804, s2: 46.502, s3: 36.104, neumatico: 'Medio', valida: false },
  { numero: 7,  s1: 27.702, s2: 44.098, s3: 35.760, neumatico: 'Duro',  valida: true },
  { numero: 8,  s1: 28.001, s2: 44.399, s3: 35.820, neumatico: 'Duro',  valida: true },
  { numero: 9,  s1: 27.601, s2: 43.950, s3: 35.779, neumatico: 'Duro',  valida: true },
  { numero: 10, s1: 27.401, s2: 43.899, s3: 35.710, neumatico: 'Duro',  valida: true }
];

const SESION_VUELTAS = (function build() {
  const totals = SESION_LAPS_RAW.map(l => l.s1 + l.s2 + l.s3);
  const validTotals = SESION_LAPS_RAW.filter(l => l.valida).map(l => l.s1 + l.s2 + l.s3);
  const min = Math.min(...validTotals);
  const max = Math.max(...validTotals);
  const range = (max - min) || 1;

  return SESION_LAPS_RAW.map((l, i) => {
    const total = totals[i];
    const isBest = l.valida && total === min;
    const barPct = !l.valida ? 16 : Math.max(6, ((max - total) / range) * 100);
    return {
      numero: l.numero,
      s1Str: fmtSector(l.s1), s2Str: fmtSector(l.s2), s3Str: fmtSector(l.s3),
      tiempoStr: fmtLap(total),
      neumatico: l.neumatico,
      barPct: barPct.toFixed(1),
      barColor: !l.valida ? 'var(--red)' : (isBest ? 'var(--green)' : 'var(--accent)'),
      rowBg: !l.valida ? 'var(--red-row)' : 'transparent',
      totalStyle: !l.valida ? 'color:var(--red); text-decoration:line-through;' : (isBest ? 'color:var(--green);' : ''),
      invalida: !l.valida, esMejor: l.valida && isBest
    };
  });
})();

const AVISO_DEFS = [
  { key: 'combustible', label: 'Combustible' },
  { key: 'banderas', label: 'Banderas' },
  { key: 'gomas', label: 'Gomas' },
  { key: 'drs', label: 'DRS' },
  { key: 'sectores', label: 'Sectores' },
  { key: 'vuelta', label: 'Vuelta' },
  { key: 'sanciones', label: 'Sanciones' },
  { key: 'ers', label: 'ERS' },
  { key: 'danos', label: 'Daños' },
  { key: 'undercut', label: 'Undercut' }
];

const state = {
  view: 'circuito',
  circuitoId: 'monza',
  showSaved: false,
  config: { margenGasolina: 0.5, gomaMin: 80, gomaMax: 110, cooldownCombustible: 80, cooldownGomas: 20 },
  muted: {}
};

function setView(v) { state.view = v; state.showSaved = false; render(); }
function pickCircuito(id) { state.circuitoId = id; render(); }
function updateConfig(field, value) { state.config[field] = value; state.showSaved = false; }
function toggleAviso(key) { state.muted[key] = !state.muted[key]; render(); }
function onGuardar() { state.showSaved = true; render(); }

function renderCircuito() {
  const c = CIRCUITOS[state.circuitoId];
  const teoricaSum = c.teorica.s1.sec + c.teorica.s2.sec + c.teorica.s3.sec;
  const delta = fmtDelta(c.mejorVuelta.total - teoricaSum);

  const pills = Object.keys(CIRCUITOS).map(id => `
    <div class="pill ${id === state.circuitoId ? 'active' : ''}" onclick="pickCircuito('${id}')">${CIRCUITOS[id].nombre}</div>
  `).join('');

  const sectorRows = ['s1', 's2', 's3'].map((k, i) => {
    const t = c.teorica[k];
    return `
      <div onclick="setView('sesion')" style="cursor:pointer; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:11px 13px; display:flex; align-items:center; justify-content:space-between;">
        <div>
          <div style="font-size:11px; color:var(--purple); font-weight:700; letter-spacing:0.04em;">RÉCORD S${i + 1}</div>
          <div style="font-size:11px; color:var(--text-dimmer); margin-top:2px;">Vuelta ${t.vuelta} · ${t.sesion}</div>
        </div>
        <div class="mono" style="font-size:16px; font-weight:700;">${fmtSector(t.sec)}</div>
      </div>`;
  }).join('');

  const teoricaRows = ['s1', 's2', 's3'].map((k, i) => {
    const t = c.teorica[k];
    return `
      <tr>
        <td class="mono" style="color:var(--text-dim);">S${i + 1}</td>
        <td class="mono" style="font-weight:600;">${fmtSector(t.sec)}</td>
        <td class="mono" style="color:var(--text-dim);">${t.vuelta}</td>
        <td><a onclick="setView('sesion')">${t.sesion}</a></td>
      </tr>`;
  }).join('');

  document.getElementById('main').innerHTML = `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:16px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <div style="width:36px; height:24px; border-radius:3px; overflow:hidden; flex-shrink:0; box-shadow:0 0 0 1px var(--border);">${FLAGS[c.flag]}</div>
        <div>
          <div style="font-size:24px; font-weight:700;">${c.nombre}</div>
          <div style="font-size:12px; color:var(--text-dim);">${c.pais}</div>
        </div>
      </div>
      <div style="display:flex; gap:6px;">${pills}</div>
    </div>

    <div style="display:grid; grid-template-columns:1.4fr 1fr; gap:20px; align-items:start;">
      <div style="display:flex; flex-direction:column; gap:20px; min-width:0;">

        <div class="card">
          <div style="display:flex; align-items:center; justify-content:space-between;">
            <div class="label" style="color:var(--purple);">Mejor vuelta histórica</div>
            <div style="font-size:12px; color:var(--text-dim);">${c.mejorVuelta.fecha}</div>
          </div>
          <div class="mono" style="font-size:44px; font-weight:700; margin:10px 0 4px; color:var(--purple);">${fmtLap(c.mejorVuelta.total)}</div>
          <div style="font-size:12px; color:var(--text-dim); margin-bottom:16px;">Lograda en <a onclick="setView('sesion')">${c.mejorVuelta.sesion}</a></div>
          <div style="display:flex; gap:10px;">
            <div class="stat-box"><div class="label">S1</div><div class="mono" style="font-size:17px; font-weight:600; margin-top:2px;">${fmtSector(c.mejorVuelta.s1)}</div></div>
            <div class="stat-box"><div class="label">S2</div><div class="mono" style="font-size:17px; font-weight:600; margin-top:2px;">${fmtSector(c.mejorVuelta.s2)}</div></div>
            <div class="stat-box"><div class="label">S3</div><div class="mono" style="font-size:17px; font-weight:600; margin-top:2px;">${fmtSector(c.mejorVuelta.s3)}</div></div>
          </div>
        </div>

        <div class="card">
          <div class="label" style="color:var(--green);">Vuelta teórica</div>
          <div style="display:flex; align-items:baseline; gap:12px; margin:10px 0 4px;">
            <div class="mono" style="font-size:30px; font-weight:700; color:var(--green);">${fmtLap(teoricaSum)}</div>
            <div class="mono" style="font-size:14px; color:var(--green);">${delta} disponibles</div>
          </div>
          <div style="font-size:12px; color:var(--text-dim); margin-bottom:14px;">Suma de los tres mejores sectores de la historia, aunque sean de sesiones distintas.</div>
          <div class="tablewrap">
            <table>
              <tr><th>Sector</th><th>Tiempo</th><th>Vuelta</th><th>Sesión</th></tr>
              ${teoricaRows}
            </table>
          </div>
        </div>

        <div class="card">
          <div class="label">Setup de la vuelta récord</div>
          <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px;">
            <div><div class="label" style="font-size:10px;">Alerón del.</div><div class="mono" style="font-size:18px; font-weight:600;">${c.setup.aleronD}</div></div>
            <div><div class="label" style="font-size:10px;">Alerón tras.</div><div class="mono" style="font-size:18px; font-weight:600;">${c.setup.aleronT}</div></div>
            <div><div class="label" style="font-size:10px;">Dif. aceler.</div><div class="mono" style="font-size:18px; font-weight:600;">${c.setup.difOn}%</div></div>
            <div><div class="label" style="font-size:10px;">Dif. freno</div><div class="mono" style="font-size:18px; font-weight:600;">${c.setup.difOff}%</div></div>
            <div><div class="label" style="font-size:10px;">Reparto freno</div><div class="mono" style="font-size:18px; font-weight:600;">${c.setup.repartoFreno}%</div></div>
            <div><div class="label" style="font-size:10px;">Presión freno</div><div class="mono" style="font-size:18px; font-weight:600;">${c.setup.presionFreno}%</div></div>
          </div>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:20px; min-width:0;">
        <div class="card">
          <div class="label">Trazado</div>
          <div style="margin-top:10px; display:flex; justify-content:center;">${TRACKS[c.track]}</div>
          <div style="font-size:11px; color:var(--text-dimmer); text-align:center; margin-top:6px;">Ilustrativo — la versión final se genera desde el paquete Motion</div>
        </div>
        <div class="card">
          <div class="label" style="color:var(--purple);">Récords por sector</div>
          <div style="display:flex; flex-direction:column; gap:8px; margin-top:12px;">${sectorRows}</div>
        </div>
      </div>
    </div>
  `;
}

function renderSesion() {
  const bars = SESION_VUELTAS.map(v => `
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px;" title="${v.tiempoStr}">
      <div style="width:100%; border-radius:3px 3px 0 0; height:${v.barPct}%; background:${v.barColor};"></div>
      <div style="font-size:10px; color:var(--text-dimmer);">${v.numero}</div>
    </div>`).join('');

  const rows = SESION_VUELTAS.map(v => `
    <tr style="background:${v.rowBg};">
      <td class="mono">${v.numero}</td>
      <td class="mono" style="color:var(--text-dim);">${v.s1Str}</td>
      <td class="mono" style="color:var(--text-dim);">${v.s2Str}</td>
      <td class="mono" style="color:var(--text-dim);">${v.s3Str}</td>
      <td class="mono" style="font-weight:600; ${v.totalStyle}">${v.tiempoStr}</td>
      <td style="color:var(--text-dim);">${v.neumatico}</td>
      <td>${
        v.invalida ? '<span class="badge" style="color:var(--red); background:var(--red-soft);">INVÁLIDA</span>'
        : v.esMejor ? '<span class="badge" style="color:var(--green); background:var(--green-soft);">MEJOR</span>'
        : '<span style="font-size:11px; color:var(--text-dimmer);">Válida</span>'
      }</td>
    </tr>`).join('');

  document.getElementById('main').innerHTML = `
    <div style="margin-bottom:22px;">
      <div style="font-size:24px; font-weight:700;">Carrera</div>
      <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">Spa-Francorchamps · 14 sep 2026</div>
    </div>

    <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;">
      <div class="card" style="padding:14px 16px;"><div class="label" style="font-size:10px;">Clima</div><div style="font-size:15px; font-weight:600; margin-top:4px;">Nublado</div></div>
      <div class="card" style="padding:14px 16px;"><div class="label" style="font-size:10px;">Temp. pista</div><div class="mono" style="font-size:15px; font-weight:600; margin-top:4px;">34°C</div></div>
      <div class="card" style="padding:14px 16px;"><div class="label" style="font-size:10px;">Temp. aire</div><div class="mono" style="font-size:15px; font-weight:600; margin-top:4px;">22°C</div></div>
      <div class="card" style="padding:14px 16px;"><div class="label" style="font-size:10px;">Setup</div><div style="font-size:12px; margin-top:4px; color:var(--text-dim);">AD ${CIRCUITOS.spa.setup.aleronD} · AT ${CIRCUITOS.spa.setup.aleronT} · RF ${CIRCUITOS.spa.setup.repartoFreno}%</div></div>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <div class="label" style="margin-bottom:14px;">Ritmo por vuelta</div>
      <div style="display:flex; align-items:flex-end; gap:6px; height:110px;">${bars}</div>
    </div>

    <div class="card">
      <div class="tablewrap">
        <table>
          <tr><th>Vuelta</th><th>S1</th><th>S2</th><th>S3</th><th>Total</th><th>Neumático</th><th>Estado</th></tr>
          ${rows}
        </table>
      </div>
    </div>
  `;
}

function renderConfig() {
  const avisos = AVISO_DEFS.map(d => `
    <label style="display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-top:1px solid var(--border); cursor:pointer;">
      <span style="font-size:14px;">${d.label}</span>
      <input type="checkbox" ${!state.muted[d.key] ? 'checked' : ''} onchange="toggleAviso('${d.key}')">
    </label>`).join('');

  document.getElementById('main').innerHTML = `
    <div style="margin-bottom:26px;">
      <div style="font-size:24px; font-weight:700;">Configuración</div>
      <div style="font-size:12px; color:var(--text-dim); margin-top:2px;">Umbrales y avisos del Crew Chief</div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start;">
      <div class="card">
        <div class="label" style="margin-bottom:16px;">Umbrales</div>

        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--border);">
          <div><div style="font-size:14px; font-weight:600;">Margen de gasolina</div><div style="font-size:12px; color:var(--text-dim);">Aviso cuando quedan menos vueltas de margen</div></div>
          <div style="display:flex; align-items:center; gap:8px;"><input type="number" step="0.1" min="0.1" max="3" value="${state.config.margenGasolina}" onchange="updateConfig('margenGasolina', parseFloat(this.value))"><span style="font-size:12px; color:var(--text-dim);">vueltas</span></div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--border);">
          <div><div style="font-size:14px; font-weight:600;">Temp. mínima gomas</div><div style="font-size:12px; color:var(--text-dim);">Por debajo de esto, gomas frías</div></div>
          <div style="display:flex; align-items:center; gap:8px;"><input type="number" step="1" value="${state.config.gomaMin}" onchange="updateConfig('gomaMin', parseFloat(this.value))"><span style="font-size:12px; color:var(--text-dim);">°C</span></div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--border);">
          <div><div style="font-size:14px; font-weight:600;">Temp. máxima gomas</div><div style="font-size:12px; color:var(--text-dim);">Por encima de esto, sobrecalentadas</div></div>
          <div style="display:flex; align-items:center; gap:8px;"><input type="number" step="1" value="${state.config.gomaMax}" onchange="updateConfig('gomaMax', parseFloat(this.value))"><span style="font-size:12px; color:var(--text-dim);">°C</span></div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--border);">
          <div><div style="font-size:14px; font-weight:600;">Cooldown combustible</div><div style="font-size:12px; color:var(--text-dim);">Tiempo mínimo entre avisos repetidos</div></div>
          <div style="display:flex; align-items:center; gap:8px;"><input type="number" step="1" value="${state.config.cooldownCombustible}" onchange="updateConfig('cooldownCombustible', parseFloat(this.value))"><span style="font-size:12px; color:var(--text-dim);">s</span></div>
        </div>
        <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-top:1px solid var(--border);">
          <div><div style="font-size:14px; font-weight:600;">Cooldown gomas</div><div style="font-size:12px; color:var(--text-dim);">Tiempo mínimo entre avisos repetidos</div></div>
          <div style="display:flex; align-items:center; gap:8px;"><input type="number" step="1" value="${state.config.cooldownGomas}" onchange="updateConfig('cooldownGomas', parseFloat(this.value))"><span style="font-size:12px; color:var(--text-dim);">s</span></div>
        </div>
      </div>

      <div class="card">
        <div class="label" style="margin-bottom:16px;">Avisos activos</div>
        <div style="display:flex; flex-direction:column;">${avisos}</div>
      </div>
    </div>

    <div style="margin-top:22px; display:flex; align-items:center; gap:14px;">
      <button onclick="onGuardar()" style="background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px; padding:11px 22px; font-size:14px; font-weight:700;">Guardar cambios</button>
      ${state.showSaved ? '<span style="font-size:13px; color:var(--green); font-weight:600;">✓ Guardado</span>' : ''}
    </div>
  `;
}

function render() {
  document.getElementById('nav-circuito').className = 'nav-btn' + (state.view === 'circuito' ? ' active' : '');
  document.getElementById('nav-sesion').className = 'nav-btn' + (state.view === 'sesion' ? ' active' : '');
  document.getElementById('nav-config').className = 'nav-btn' + (state.view === 'config' ? ' active' : '');
  if (state.view === 'circuito') renderCircuito();
  else if (state.view === 'sesion') renderSesion();
  else renderConfig();
}

render();
</script>
